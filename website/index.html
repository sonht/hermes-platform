<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes AI</title><style>body{font:16px system-ui;margin:0;background:#f4f6fa;color:#172033}header{background:#14213d;color:white;padding:18px 28px;font-weight:700}main{max-width:850px;margin:30px auto;background:white;border-radius:14px;box-shadow:0 4px 24px #0001;overflow:hidden}#messages{height:60vh;overflow:auto;padding:24px}.message{padding:12px 16px;margin:12px 0;border-radius:12px;white-space:pre-wrap;line-height:1.5}.user{background:#e7f0ff;margin-left:15%}.assistant{background:#f1f3f6;margin-right:12%}form{display:flex;gap:10px;padding:16px;border-top:1px solid #ddd}input{flex:1;padding:13px;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#2259bc;color:white;border:0;border-radius:9px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.5}small{display:block;padding:0 24px 15px;color:#667}</style></head><body><header>✦ Hermes AI · Cổng hỗ trợ</header><main><div id="messages" aria-live="polite"><div class="message assistant">Xin chào! Tôi có thể hỗ trợ hướng dẫn sử dụng dm.kcb.vn.</div></div><form id="chat"><input id="question" maxlength="2000" placeholder="Nhập câu hỏi của bạn..." aria-label="Câu hỏi" required autocomplete="off"><button id="send">Gửi</button></form><small>Trợ lý AI có thể nhầm lẫn. Không nhập mật khẩu hoặc dữ liệu bệnh nhân.</small></main><script src="./app.js"></script></body></html>
